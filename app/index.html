<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Cover Studio</h1>
    <p class="tagline">Your photo, three panels, one sunset — a GTA-style cover in a few clicks. Everything runs offline in this page; photos never leave your machine.</p>

    <h2>1 · Photos</h2>
    <div id="panels"></div>
    <label class="check"><input id="same-photo" type="checkbox"> Same photo in all three panels</label>

    <h2>2 · Caption</h2>
    <label class="field">Caption
      <input id="caption" type="text" maxlength="40" value="Sunset Heist">
    </label>

    <h2>3 · Grade</h2>
    <div id="grades" class="btn-row" role="group" aria-label="Colour grade"></div>

    <h2>4 · Size</h2>
    <div id="sizes" class="btn-row" role="group" aria-label="Export size"></div>

    <h2>5 · Position</h2>
    <p class="hint">Click a panel to select it, drag the preview to pan it.</p>
    <label class="field">Zoom <span id="zoom-value">100%</span>
      <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1">
    </label>
    <button id="reset-pan" type="button">Reset position</button>

    <button id="export" type="button" class="export">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
